<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Travel Blog - Subscription</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="form_style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />

</head>
<body>
        <nav class="navbar">
            <div class="logo">
                <a href="index.html"><img src="images/HK_travel_guide_logo.jpg"></a>
            </div>
            <div class="menu_container">
            <a class="item" href="index.html">HOME</a>
           
            <div class="item">
                <a href="local.html">LOCAL 文化</a>
                <div class="dropdown">
                    <div class="dropdown_content">
                    <a href="local.html#L1">西九</a>
                    <a href="local.html#L2">大館</a>
                    </div>
                </div>
            </div>
            <div class="item">
                <a href="wild.html">WILD 山野</a>
                <div class="dropdown">
                    <div div class="dropdown_content">
                    <a href="wild.html#W1">大澳</a>
                    <a href="wild.html#W2">海下</a>
                    <a href="wild.html#W3">龍脊</a>
                    </div>
                </div>
            </div>
            <a class="item" href="taste.html">TASTE 嚐味</a>
            <a class="item" href="bazaar.html">BAZAAR 集市</a>
            <a class="item" href="sub.html">SUBSCRIBE</a>           
            
            <div class="underline"></div>
            </div>
            <div class="hamburger" onclick="openSidebar()"><i class="fa fa-bars" aria-hidden="true"></i></div>           
        </nav>
    </div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar_content">
            <div class="hamburger_close" onclick="closeSidebar()" style="padding: 2rem;"><i class="fa fa-times"></i></div>
            <ul style="list-style: none; padding: 2rem; letter-spacing: 0.1em;">
                <li><a href="index.html" >HOME</a></li><br>
                <li><a href="local.html">LOCAL 文化</a></li><br>
                <li><a href="wild.html">WILD 山野</a></li><br>
                <li><a href="taste.html">TASTE 嚐味</a></li><br>
                <li><a href="bazaar.html">BAZAAR 集市</a></li><br>
                <li><a href="sub.html">SUBSCRIBE</a></li>
            </ul>
        </div>
    </div>
    <div>
        <section class="container">
            <header><b>Let's Join Us 😊</b></header>
            <form name="reg" class="form" onsubmit="welcome();">
            <div class="input-box">
                <label>User Name</label>
                <input type="text" id="uname" placeholder="5 or more characters" 
                pattern="[a-zA-Z0-9]{5,}" required="required" />
            </div>
    
            <div class="input-box">
                <label>Email Address</label>
                <input type="email" placeholder="e.g. demo@gmail.com" required="required" />
            </div>
    
            <div class="column">
                <div class="input-box">
                <label>Phone (optional)</label>
                <input type="tel" placeholder="Enter phone number"/>
                </div>
                <div class="input-box">
                <label>Birthday</label>
                <input type="date" placeholder="Enter birth date" required="required"/>
                </div>
            </div>
            <div class="gender-box">
                <h3>Gender</h3>
                <div class="gender-option">
                <div class="gender">
                    <input type="radio" id="check-male" name="gender" checked="checked" required="required"/>
                    <label for="check-male">Male</label>
                </div>
                <div class="gender">
                    <input type="radio" id="check-female" name="gender" required="required"/>
                    <label for="check-female">Female</label>
                </div>
                </div>
            </div>
            <div class="input-box">
                <label>Self Introduction (optional)</label><br>
                <textarea placeholder="Tell us more..." rows="10" cols="50%"></textarea>
            </div>
            <div class="input-box">
                <label>Set Password</label>
                <input type="password" placeholder="8 or more characters (with at least one number and one uppercase)" 
                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" required="required"/>   
            </div>
            
            <button type="submit">SUBSCRIBE</button>
            <button id="reset" type="reset">Reset</button>
            </form>
        </section>
    </div>

<script>
    function openSidebar(){
        document.getElementById("sidebar").style.display = "block";
    }

    function closeSidebar(){
        document.getElementById("sidebar").style.display = "none";
    }

// The function will prompt a welcome message with the user's provided name 
// only if the input fields are validated
    function welcome(){
        let uname = document.getElementById("uname").value
        window.alert('Welcome '+`${uname} ! You've subscribed successfully.`);
    }

</script>    
</body>
</html>
